[project]
name = "modelo"
version = "0.1.0"
description = "Modelo de precio de departamentos usados en Providencia"
readme = "README.md"
authors = [
    { name = "German Goni", email = "ggoni@uc.cl" }
]
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.10",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "xgboost>=3.4.1",
]

[project.scripts]
modelo = "modelo.cli:main"

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.2",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
[tool.ruff]
line-length = 100
