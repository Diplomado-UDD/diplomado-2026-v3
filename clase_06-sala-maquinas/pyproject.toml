[project]
name = "sala-maquinas"
version = "0.1.0"
description = "Laboratorio clase 6: tokens, costos, embeddings y búsqueda semántica"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipywidgets>=8.1.9",
    "numpy>=2.5.4",
    "plotly>=7.1.0",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.2.0",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = ["ipykernel>=7.4.0", "nbconvert>=7.17.2"]
