[project]
name = "vision"
version = "0.1.0"
description = "Laboratorio clase 7: imágenes como números, convolución, YOLO26 y lectura de documentos con Claude"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.6.0",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pillow>=12.0.0",
    "python-dotenv>=1.2.4",
    "ultralytics>=8.4.204",
]

[dependency-groups]
dev = ["ipykernel>=7.4.0", "nbconvert>=7.17.2"]
