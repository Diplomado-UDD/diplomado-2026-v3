[project]
name = "agentes"
version = "0.1.0"
description = "Laboratorio clase 8: automatización con un componente agéntico frente a un agente con autonomía controlada"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.6.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "pytest>=9.2.0",
    "pytest-randomly>=5.1.0",
]
